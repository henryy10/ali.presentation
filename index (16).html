add('Weekend warm-up','Warm-up · 3 min',`<p class="eyebrow">Let’s start with you</p><h2>What do you do at weekends?</h2><p class="sub">Что вы делаете на выходных?</p><div class="grid activities">${[['⚽','Play football','Играть в футбол'],['🎬','Watch movies','Смотреть фильмы'],['🌿','Go for a walk','Ходить гулять'],['🎮','Play computer games','Играть в компьютерные игры'],['👋','Spend time with friends','Проводить время с друзьями']].map(x=>`<button class="card activity" data-activity="${x[1].toLowerCase()}"><span class="icon">${x[0]}</span><strong>${x[1]}</strong>${ru(x[2])}</button>`).join('')}</div><div class="completion" id="weekend">I usually ______ at weekends.${ru('Обычно по выходным я ______. Нажмите на занятие.')}</div>`,'Попросите 3–4 учеников закончить предложение. Нажмите на карточку, чтобы показать пример.');
add('Today’s goals','Goals · 1 min',`<p class="eyebrow">Your speaking toolkit</p><h2>Today we will learn to…</h2><p class="sub">Сегодня мы научимся…</p><div class="grid three">${[['01','INVITE','Invite a friend somewhere.','Приглашать друга куда-нибудь.'],['02','ACCEPT','Agree to an invitation.','Соглашаться на приглашение.'],['03','REFUSE','Refuse politely.','Вежливо отказываться.']].map(x=>`<div class="card objective"><div class="number">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p>${ru(x[3])}</div>`).join('')}</div>`,'Прочитайте цели вместе. В конце вернитесь к ним на слайде рефлексии.');
add('Why don’t we…?','Language · 9 min total',`<p class="eyebrow">01 / Inviting together</p><h2>Why don’t we…?</h2><p class="sub">Почему бы нам не…?</p><div class="formula">Why don’t we + <mark>V1</mark>…?</div><div class="grid two"><div class="card"><div class="example">Why don’t we <mark>play</mark> football?${ru('Почему бы нам не поиграть в футбол?')}</div><div class="example">Why don’t we <mark>go</mark> to the park?${ru('Почему бы нам не пойти в парк?')}</div></div><div><div class="why"><strong>Почему V1?</strong><br>После do / don’t основной глагол стоит в начальной форме <b>без to</b>: play, а не playing или to play. Здесь это предложение сделать что-то вместе.</div><div class="error">✕ Why don’t we playing football?<br><span class="correct">✓ Why don’t we play football?</span></div></div></div><div class="notice"><b>V1</b> = начальная форма • <b>we</b> → нам • <b>you</b> → тебе / вам</div>`,'Why don’t we — предложение сделать вместе. Why don’t you — предложение собеседнику. В другом контексте эта форма может быть буквальным вопросом; здесь используем как приглашение.');
add('How about…?','Language',`<p class="eyebrow">02 / Suggest an activity</p><h2>How about…?</h2><p class="sub">Как насчёт того, чтобы…?</p><div class="formula">How about + <mark>V-ing</mark>…?</div><div class="grid two"><div class="card"><div class="example">How about <mark>watching</mark> a movie?${ru('Как насчёт того, чтобы посмотреть фильм?')}</div><div class="example">How about <mark>going</mark> swimming?${ru('Как насчёт того, чтобы пойти поплавать?')}</div></div><div><div class="why"><strong>Почему -ing?</strong><br><b>About — предлог.</b> После предлога действие обычно называем формой с -ing (герундием): watching a movie — просмотр фильма.</div><div class="error">✕ How about watch a movie?<br><span class="correct">✓ How about watching a movie?</span></div></div></div><div class="notice">Можно и существительное: <b>How about a movie?</b> — Как насчёт фильма?</div>`,'Going swimming — устойчивое сочетание: go swimming — ходить плавать. После How about меняется первый глагол: going swimming.');
add('Let’s…','Language',`<p class="eyebrow">03 / Make a plan together</p><h2>Let’s…</h2><p class="sub">Давай / Давайте…</p><div class="formula">Let’s + <mark>V1</mark></div><div class="grid two"><div class="card"><div class="example">Let’s <mark>play</mark> basketball!${ru('Давай поиграем в баскетбол!')}</div><div class="example">Let’s <mark>go</mark> shopping!${ru('Давай пойдём за покупками!')}</div></div><div><div class="why"><strong>Почему V1?</strong><br><b>Let’s = let us.</b> В этой конструкции после let используется глагол без to. Let’s уже выражает предложение сделать что-то вместе.</div><div class="error">✕ Let’s playing basketball!<br><span class="correct">✓ Let’s play basketball!</span></div></div></div><div class="notice"><b>Let’s + play + basketball.</b> Не добавляем to или -ing к основному глаголу.</div>`,'В go shopping слово shopping — часть сочетания. После Let’s стоит начальная форма go.');
add('Three ways to invite','Compare',`<p class="eyebrow">Same idea · different forms</p><h2>Three Ways to Invite Someone</h2><p class="sub">Три способа пригласить человека</p><div class="grid three compare">${[['Why don’t we + V1?','Why don’t we <mark>watch</mark> a movie?','Почему бы нам не посмотреть фильм?'],['How about + V-ing?','How about <mark>watching</mark> a movie?','Как насчёт того, чтобы посмотреть фильм?'],['Let’s + V1','Let’s <mark>watch</mark> a movie!','Давай посмотрим фильм!']].map(x=>card(`<div class="formula">${x[0]}</div><p>${x[1]}</p>${ru(x[2])}`)).join('')}</div><div class="why spacer"><strong>REMEMBER / ЗАПОМНИ</strong><br>Why don’t we → <b>V1</b> &nbsp; • &nbsp; How about → <b>V-ing</b> &nbsp; • &nbsp; Let’s → <b>V1</b></div>`,'Покажите одно действие watch во всех трёх конструкциях. Спросите: где появляется -ing и почему?');
add('Accepting invitations','Responses · 3 min total',`<p class="eyebrow">Say yes</p><h2>Accepting — Согласие</h2><p class="sub">Be positive. Make a plan. / Согласитесь на приглашение.</p><div class="grid two"><div class="card"><div class="phrase">That’s a good idea!${ru('Хорошая идея!')}</div><div class="phrase">I’d love to!${ru('С удовольствием!')}</div><div class="phrase">That sounds great!${ru('Звучит здорово!')}</div></div><div><div class="why"><strong>Почему I’d love to?</strong><br><b>I’d = I would.</b> Это вежливое согласие. В коротком ответе <b>to</b> остаётся, а понятное действие после него не повторяется.</div><div class="card spacer"><p>A: Would you like to go to the cinema?</p>${ru('Хочешь пойти в кино?')}<p style="margin-top:15px;color:var(--aqua)">B: I’d love to!</p>${ru('С удовольствием!')}</div></div></div>`,'Полная форма: I’d love to go to the cinema. Короткий ответ: I’d love to. Не говорим, что to заменяет глагол: после to опущена уже понятная часть.');
add('Refusing politely','Responses',`<p class="eyebrow">Say no, kindly</p><h2>Refusing — Вежливый отказ</h2><p class="sub">Thank your friend first. / Сначала поблагодарите за приглашение.</p><div class="grid two shorter"><div class="card"><div class="phrase">Thanks, but I can’t.${ru('Спасибо, но я не могу.')}</div><div class="phrase">I’d love to, but I can’t.${ru('Я бы с удовольствием, но не могу.')}</div><div class="phrase">I’d rather not, but thanks anyway.${ru('Я бы предпочёл отказаться, но всё равно спасибо.')}</div></div><div><div class="why"><strong>Как это устроено?</strong><br><b>Can’t = cannot</b> — не могу.<br><b>I’d rather not = I would rather not</b> — предпочёл бы не делать этого.<br>Благодарность делает отказ вежливее.</div><div class="card spacer"><p>A: Let’s go to the park!</p>${ru('Давай пойдём в парк!')}<p style="margin-top:15px">B: Thanks, but I can’t. I have homework.</p>${ru('Спасибо, но не могу. У меня домашнее задание.')}</div></div></div>`,'Предложите назвать одну причину отказа: homework, family plans. Нельзя утверждать, что любой отказ обязательно требует причины.');
add('Quick check','Practice · 3 min',`<p class="eyebrow">Tap your answer</p><h2>Choose the Correct Answer</h2><p class="sub">Выберите правильный ответ. Объясните свой выбор.</p><div class="grid quiz-grid">${quizData.map((x,i)=>`<div class="card quiz" data-quiz="${i}"><p class="q">${i+1}. ${x[0]}</p><div class="options">${x[1].map((o,j)=>`<button data-choice="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div></div>`).join('')}</div>`,'Попросите учеников не только нажать ответ, но и назвать правило. Ошибка не блокирует повторную попытку.');
add('Exercise 2 · Listen and read','Textbook · 4 min',`<p class="eyebrow">Page 36 · Exercise 2</p><h2>Listen and Read</h2><p class="sub">Kairat and Ryan are talking about their weekend plans.${ru('Кайрат и Райан обсуждают планы на выходные.')}</p><div class="grid two"><div>${lake}<div class="small">Kolsai Lakes · Кольсайские озёра<br>Illustration / Иллюстрация</div></div><div><div class="audio"><div class="row"><button class="primary" id="audioPlay" disabled aria-label="Play or pause audio">▶ Play</button><span id="audioStatus" class="audiostatus">Audio not loaded</span></div><input id="audioSeek" type="range" min="0" max="100" value="0" step="0.1" disabled aria-label="Audio progress"><div class="timerange"><span id="audioTime">0:00</span><span id="audioDuration">0:00</span></div><div class="spacer"><label>＋ Load MP3 / Загрузить <input type="file" id="audioFile" accept="audio/*,.mp3"></label></div><audio id="audio" preload="metadata"></audio></div><div class="why spacer"><strong>Listen carefully.</strong><br>What activity does Kairat suggest?${ru('Какое занятие предлагает Кайрат?')}</div><div class="small spacer">Open your textbook: page 36.<br>Откройте учебник на странице 36.</div></div></div>`,'Загрузите настоящий аудиофайл кнопкой Load MP3. Если записи нет, прочитайте диалог из бумажного учебника по ролям. Запись и страница учебника не встроены.');
add('Exercise 2 · Understanding','Textbook · 2 min',`<p class="eyebrow">Page 36 · Exercise 2</p><h2>Check Your Understanding</h2><p class="sub">Answer first. Then tap to check. / Сначала ответьте, затем проверьте.</p><div class="grid two">${[['Who is talking in the dialogue?','Кто разговаривает в диалоге?','Kairat and Ryan.','Кайрат и Райан.'],['Where does Kairat want to go?','Куда Кайрат хочет поехать?','To Kolsai Lakes.','На Кольсайские озёра.'],['What activity does Kairat suggest?','Что предлагает сделать Кайрат?','Going sailing.','Покататься под парусом.'],['Does Ryan accept immediately?','Райан соглашается сразу?','No. He needs to ask his parents first.','Нет. Сначала ему нужно спросить родителей.']].map((x,i)=>reveal(`<p>${i+1}. ${x[0]}</p>${ru(x[1])}`,`<p>${x[2]}</p>${ru(x[3])}`)).join('')}</div>`,'Ожидаемые ответы приведены в исходном задании пользователя. Сверьте их с диалогом в учебнике, если используется другое издание.');
add('Exercise 3 · Same meaning','Textbook · 3 min',`<p class="eyebrow">Page 36 · Exercise 3</p><h2>Find the Same Meaning</h2><p class="sub">Find expressions in the dialogue with the same meaning.${ru('Найдите в диалоге выражения с таким же значением.')}</p><div class="grid three" id="equivalents">${[['Why don’t you join me?','Why don’t you come with me?','Join me и come with me здесь означают «присоединиться / пойти со мной».'],['We can ask them together.','Let’s ask them together.','Обе фразы выражают идею спросить вместе. Let’s — прямое предложение.'],['That’s a good idea.','That sounds great!','Обе фразы в этом диалоге выражают согласие.']].map((x,i)=>reveal(`${tag('0'+(i+1))}<p>${x[0]}</p>`,`<p>${x[1]}</p>${ru(x[2])}`)).join('')}</div><button class="primary spacer" id="allEquivalents">Show Answers / Показать ответы</button>`,'Дайте 1 минуту найти выражения в учебнике. Ответы можно открыть по одному или все сразу.');
add('Exercise 4 · Translation','Textbook · 3 min',`<p class="eyebrow">Page 36 · Exercise 4</p><h2>Translate into Russian</h2><p class="sub">Переведите предложения на русский язык.</p><div class="grid three">${[['Have you made any plans for next weekend?','У тебя есть планы на следующие выходные?'],['How about going sailing?','Как насчёт того, чтобы покататься под парусом?'],['Let’s ask them together, then.','Тогда давай спросим их вместе.']].map((x,i)=>reveal(`${tag('0'+(i+1))}<p>${x[0]}</p>`,`<p lang="ru">${x[1]}</p>`)).join('')}</div><div class="why spacer"><strong>A small grammar note / Коротко о грамматике</strong><br><b>Have + subject + V3…?</b> — вопрос Present Perfect.<br><b>Have you made any plans…?</b> — спрашиваем, появились ли планы к настоящему моменту. Make → made → made.</div>`,'Основная тема — приглашения. Present Perfect объясните кратко: have + подлежащее + третья форма. Не превращайте это в отдельный урок.');
add('Exercise 7 · Pronunciation','Sounds · 3 min total',`<p class="eyebrow">Page 36 · Exercise 7 · Teacher-led</p><h2>Pronunciation Practice</h2><p class="sub">Сначала слушайте учителя, затем повторяйте. Аудиозапись не требуется.</p><div class="grid three">${[['/tʃ/','Близко к русскому «ч»','chance<br>champion'],['/dʒ/','Приблизительно «дж»','jet · juice<br>jar'],['/j/','Близко к русскому «й»','yes<br>yet']].map(x=>card(`<div class="sound">${x[0]}</div><p class="small">${x[1]}</p><div class="words">${x[2]}</div>`)).join('')}</div><div class="notice"><b>change /tʃeɪndʒ/</b> → <mark>/tʃ/</mark> at the beginning / в начале; <mark>/dʒ/</mark> at the end / в конце.</div>`,'Английский /tʃ/ обычно твёрже русского ч. /dʒ/ — один слитный звук. /j/ — согласный, не звук названия буквы J. Модель даёт учитель.');
add('Sound detective','Sounds',`<p class="eyebrow">Exercise 7 · Your turn</p><h2>Which sound can you hear?</h2><p class="sub" id="soundPrompt">Выберите первый звук слова.</p><div class="card"><div class="row" style="justify-content:space-between"><span class="tag">SOUND DETECTIVE</span><span class="small" id="soundCount"></span></div><div id="soundWord" class="word-display"></div><div class="row sound-options" id="soundOptions">${['/tʃ/','/dʒ/','/j/'].map((x,i)=>`<button data-sound="${i}">${x}</button>`).join('')}</div><div id="soundFeedback" class="feedback" style="text-align:center" aria-live="polite"></div></div><div class="row spacer" style="justify-content:space-between"><p class="small">Listen to your teacher. / Слушайте учителя.</p><button id="nextSound" class="primary">Next word →</button></div>`,'Последняя карточка отдельно проверяет конечный звук в change. Можно повторить весь цикл кнопкой «Сначала».');
add('Notebook · Invitations','Write · 3 min total',`<p class="eyebrow">Write this down / Запишите</p><h2>Write in Your Notebooks</h2><p class="sub">Inviting — Приглашение</p><div class="notebook"><p><b>Why don’t we + V1?</b> &nbsp; Why don’t we play football?</p>${ru('Почему бы нам не поиграть в футбол?')}<p><b>How about + V-ing?</b> &nbsp; How about watching a movie?</p>${ru('Как насчёт того, чтобы посмотреть фильм?')}<p><b>Let’s + V1</b> &nbsp; Let’s go to the park!</p>${ru('Давай пойдём в парк!')}</div><div class="row spacer"><button class="secondary notebookToggle">Notebook Mode / Режим тетради</button><p class="small">V1 — начальная форма глагола без to.</p></div>`,'Дайте время списать формулы и примеры. Режим тетради убирает декоративную шапку. Слайд не переключается автоматически.');
add('Notebook · Responses','Write',`<p class="eyebrow">Write this down / Запишите</p><h2>Accepting & Refusing</h2><p class="sub">Согласие и вежливый отказ</p><div class="grid two"><div class="notebook"><h3 style="color:var(--aqua)">Accepting — Согласие</h3><p>That’s a good idea!</p>${ru('Хорошая идея!')}<p>I’d love to!</p>${ru('С удовольствием!')}</div><div class="notebook"><h3 style="color:var(--purple)">Refusing — Отказ</h3><p>Thanks, but I can’t.</p>${ru('Спасибо, но я не могу.')}<p>I’d love to, but I can’t.</p>${ru('Я бы с удовольствием, но не могу.')}</div></div><div class="notice"><b>Remember:</b> Why don’t we → V1 &nbsp; / &nbsp; How about → V-ing &nbsp; / &nbsp; Let’s → V1</div><button class="secondary notebookToggle spacer">Notebook Mode / Режим тетради</button>`,'Попросите подчеркнуть одну фразу согласия и одну фразу отказа, которые ученик хочет использовать.');
add('Open the Box','Team challenge · 4 min',`<p class="eyebrow">Team A vs Team B</p><h2>Open the Box</h2><div class="game-info"><span>Choose a box. Answer in 10 seconds. Correct = 1 point.</span><a href="https://wordwall.net/" target="_blank" rel="noopener">Open Wordwall homepage ↗</a></div><p class="small">Выберите коробку. На ответ — 10 секунд. Правильный ответ = 1 балл. Игра ниже работает без интернета.</p><div class="scorebar"><button class="team selected" data-team="0">TEAM A <b id="scoreA">0</b></button><button class="team" data-team="1">TEAM B <b id="scoreB">0</b></button><span class="small" id="teamTurn">Ход: TEAM A</span><label class="small" style="margin-left:auto"><input type="checkbox" id="alternate" checked> Чередовать ходы</label><button class="quiet" id="resetGame">↺ Reset Game</button></div><div class="grid boxes" id="boxes"></div><p class="small spacer">If time is short, play 6–8 boxes. / Если времени мало, откройте 6–8 коробок.<br>Wordwall — ссылка на главную страницу, а не на готовую игру.</p>`,'Команду можно выбрать вручную. Таймер запускается при открытии коробки; он не оценивает ответ автоматически. Если закрываете без оценки, команда не меняется.');
add('Homework · Exercise 6','Homework · 1 min',`<p class="eyebrow">Page 36 · Exercise 6 · At home</p><h2>Homework</h2><p class="sub">Write a dialogue (6–8 lines). / Напишите диалог из 6–8 реплик.</p><div class="hw"><div><div class="card"><p style="font-size:27px">Your friend Serik is going kayaking in Aktau this weekend. He invites you to go with him. Use phrases from Exercise 1 to act out your dialogue.</p>${ru('Серик собирается кататься на каяке в Актау на этих выходных и приглашает вас с собой.')}</div><div class="why spacer"><strong>Our written task / Письменное задание</strong><br>6–8 реплик. Минимум <b>3 выражения</b> из сегодняшнего урока. Укажите <b>Aktau</b> и <b>this weekend</b>. Выполните самостоятельно дома.</div></div><div class="card"><span class="tag aqua">EXAMPLE / ОБРАЗЕЦ</span><div class="dialogue"><b>Serik:</b> Have you got any plans for this weekend?<br><b>Friend:</b> No, I haven’t.<br><b>Serik:</b> How about going kayaking in Aktau?<br><b>Friend:</b> That sounds great!<br><b>Serik:</b> Let’s go together!<br><b>Friend:</b> I’d love to!</div></div></div>`,'Задание учебника устное, но здесь адаптировано в индивидуальный письменный диалог. Упоминание Exercise 1 — только в исходной инструкции, отдельно его в классе не выполняем.');
add('Reflection & goodbye','Reflection · 1 min',`<p class="eyebrow">You’ve got the words. Now use them.</p><h2>What Have You Learned Today?</h2><p class="sub">Что вы сегодня узнали?</p><div class="grid three finalgrid">${[['How can you invite a friend?','Как пригласить друга?','Let’s go to the park!','Давай пойдём в парк!'],['How can you accept an invitation?','Как согласиться?','I’d love to!','С удовольствием!'],['How can you refuse politely?','Как вежливо отказаться?','Thanks, but I can’t.','Спасибо, но я не могу.']].map(x=>reveal(`<h3>${x[0]}</h3>${ru(x[1])}`,`<p>${x[2]}</p>${ru(x[3])}`)).join('')}</div><div class="endline">GREAT JOB, EVERYONE! <span style="font-weight:400">SEE YOU NEXT TIME!</span></div><p class="ru">Отличная работа! До следующего урока!</p>`,'Попросите каждого мысленно выбрать одну освоенную фразу. Thank you for your work. See you next time!');
$('#slides').innerHTML=slides.map((x,i)=>`<section class="slide ${i===0?'active':''}" data-slide="${i}" aria-label="${i+1}. ${x.title}" ${i?'inert':''}>${x.body}</section>`).join('');

function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900));}addEventListener('resize',resize);resize();
function go(i){i=Math.max(0,Math.min(slides.length-1,i));if(i!==current){$('#audio').pause();clearInterval(gameInterval);}current=i;$$('.slide').forEach((s,j)=>{s.classList.toggle('active',j===i);s.inert=j!==i;});$('#counter').textContent=`${i+1} / ${slides.length}`;$('#progress').style.width=`${(i+1)/slides.length*100}%`;$('#phase').textContent=slides[i].phase;$('#prev').disabled=i===0;$('#next').disabled=i===slides.length-1;$('#notesPanel').innerHTML=`<b>Teacher notes / Подсказка</b><br>${slides[i].note}`;$('#stage').classList.remove('note-mode');try{sessionStorage.setItem('ee-slide',String(i));}catch{}}
function openModal(id){lastFocus=document.activeElement;$('#'+id).classList.add('visible');const b=$('#'+id).querySelector('button');if(b)b.focus();}
function closeModal(id){$('#'+id).classList.remove('visible');if(lastFocus?.isConnected)lastFocus.focus();}
function setReveal(el,open){el.classList.toggle('open',open);el.setAttribute('aria-expanded',String(open));el.querySelector('.answer').hidden=!open;}
document.addEventListener('click',e=>{let el=e.target.closest('.reveal');if(el)setReveal(el,!el.classList.contains('open'));el=e.target.closest('[data-next]');if(el)go(current+1);el=e.target.closest('[data-close]');if(el)closeModal(el.dataset.close);el=e.target.closest('[data-activity]');if(el)$('#weekend').innerHTML=`I usually <b>${el.dataset.activity}</b> at weekends.${ru('Обычно по выходным я '+({'play football':'играю в футбол','watch movies':'смотрю фильмы','go for a walk':'хожу гулять','play computer games':'играю в компьютерные игры','spend time with friends':'провожу время с друзьями'}[el.dataset.activity])+'.')}`;el=e.target.closest('.notebookToggle');if(el){const on=$('#stage').classList.toggle('note-mode');$$('.notebookToggle').forEach(b=>b.setAttribute('aria-pressed',String(on)));}el=e.target.closest('[data-choice]');if(el){const q=el.closest('[data-quiz]'),d=quizData[+q.dataset.quiz],ok=+el.dataset.choice===d[2];q.querySelectorAll('button').forEach(b=>b.classList.remove('yes','no'));el.classList.add(ok?'yes':'no');q.querySelector('.feedback').textContent=(ok?'✓ Верно. ':'↻ Попробуйте ещё. ')+d[3];}});
$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);$('#home').onclick=()=>go(0);
$('#overview').onclick=()=>{$('#overviewList').innerHTML=slides.map((x,i)=>`<button data-jump="${i}" class="${i===current?'current':''}">${String(i+1).padStart(2,'0')} · ${x.title}</button>`).join('');openModal('overviewModal');};$('#overviewList').onclick=e=>{const b=e.target.closest('[data-jump]');if(b){go(+b.dataset.jump);closeModal('overviewModal');}};
$('#notes').onclick=()=>{notesOpen=!notesOpen;$('#notesPanel').classList.toggle('visible',notesOpen);$('#notes').setAttribute('aria-expanded',String(notesOpen));};
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500);}
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Нажмите F11 для полного экрана.');}};
$('#allEquivalents').onclick=()=>$$('#equivalents .reveal').forEach(b=>setReveal(b,true));
document.addEventListener('keydown',e=>{const visible=$('.overlay.visible');if(visible){if(e.key==='Escape'){if(visible.id==='gameModal')returnBoxes();else closeModal(visible.id);}if(e.key==='Tab'){const f=[...visible.querySelectorAll('button:not(:disabled),a,input')].filter(el=>!el.hidden&&el.offsetParent);if(!f.length)return;const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1);}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='Escape'&&notesOpen)$('#notes').click();});
let touchStart;$('#slides').addEventListener('touchstart',e=>{if(e.target.closest('button,a,input,label'))return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});$('#slides').addEventListener('touchend',e=>{if(!touchStart||$('.overlay.visible'))return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6)go(current+(dx<0?1:-1));touchStart=null;},{passive:true});
const audio=$('#audio');let audioURL;const time=s=>{s=Number.isFinite(s)?s:0;return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;};
$('#audioFile').onchange=e=>{const file=e.target.files[0];if(!file)return;audio.pause();if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(file);audio.src=audioURL;$('#audioStatus').textContent='Loading…';audio.load();};
audio.onloadedmetadata=()=>{$('#audioStatus').textContent=$('#audioFile').files[0]?.name||'Audio loaded';$('#audioDuration').textContent=time(audio.duration);$('#audioPlay').disabled=false;$('#audioSeek').disabled=false;};
audio.onerror=()=>{$('#audioStatus').textContent='Не удалось открыть аудио. Выберите MP3.';$('#audioPlay').disabled=true;$('#audioSeek').disabled=true;};
audio.ontimeupdate=()=>{$('#audioTime').textContent=time(audio.currentTime);$('#audioSeek').value=Number.isFinite(audio.duration)&&audio.duration?audio.currentTime/audio.duration*100:0;};
audio.onplay=()=>$('#audioPlay').textContent='Ⅱ Pause';audio.onpause=()=>$('#audioPlay').textContent='▶ Play';audio.onended=()=>$('#audioPlay').textContent='▶ Play';$('#audioPlay').onclick=async()=>{try{if(audio.paused)await audio.play();else audio.pause();}catch{toast('Не удалось воспроизвести файл. Выберите другой MP3.');}};$('#audioSeek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=e.target.value/100*audio.duration;};
const soundData=[['chance',0],['champion',0],['jet',1],['juice',1],['jar',1],['yes',2],['yet',2],['change',0],['change',1,'final']];let soundIndex=0;function renderSound(){const d=soundData[soundIndex];$('#soundWord').textContent=d[0];$('#soundPrompt').textContent=d[2]?'Теперь выберите ПОСЛЕДНИЙ звук слова change.':'Выберите ПЕРВЫЙ звук слова.';$('#soundCount').textContent=`${soundIndex+1} / ${soundData.length}`;$('#soundFeedback').textContent='';$$('[data-sound]').forEach(b=>b.classList.remove('yes','no'));$('#nextSound').textContent=soundIndex===soundData.length-1?'↺ Сначала':'Next word →';}
$$('[data-sound]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.sound===soundData[soundIndex][1];$$('[data-sound]').forEach(x=>x.classList.remove('yes','no'));b.classList.add(ok?'yes':'no');$('#soundFeedback').textContent=ok?'✓ Верно! Повторите слово за учителем.':'↻ Послушайте учителя ещё раз. Обратите внимание на '+(soundData[soundIndex][2]?'конец':'начало')+' слова.';});$('#nextSound').onclick=()=>{soundIndex=(soundIndex+1)%soundData.length;renderSound();};renderSound();
const gameData=[['Translate: “Let’s play football!”','Давай поиграем в футбол!'],['Complete: How about ___ (go) swimming?','going'],['Translate: “That’s a good idea!”','Хорошая идея!'],['Choose a polite refusal.<br>A: I’d love to!<br>B: Thanks, but I can’t.','B — Thanks, but I can’t.'],['Complete: Why don’t we ___ (watch) a movie?','watch'],['Translate: “I’d love to!”','С удовольствием!'],['Invite your friend to the cinema.','Example: Let’s go to the cinema!'],['Accept: “Let’s go shopping!”','Example: That sounds great!'],['Complete: Let’s ___ (play) basketball.','play'],['What does “refusing” mean in Russian?','Отказ'],['Refuse politely: “Let’s go to the park!”','Example: Thanks, but I can’t.'],['Where does Kairat want to go sailing?','Kolsai Lakes.']];
let scores=[0,0],team=0,used=new Set(),gameActive=-1,gameScored=false,gameInterval=null,remaining=10;
function renderGame(){$('#scoreA').textContent=scores[0];$('#scoreB').textContent=scores[1];$('#teamTurn').textContent=`Ход: TEAM ${team?'B':'A'}`;$$('[data-team]').forEach(b=>b.classList.toggle('selected',+b.dataset.team===team));$('#boxes').innerHTML=gameData.map((x,i)=>`<button class="box ${used.has(i)?'used':''}" data-box="${i}" ${used.has(i)?'disabled':''} aria-label="Box ${i+1}${used.has(i)?', used':''}">${used.has(i)?'✓':i+1}</button>`).join('');}
function startTimer(){clearInterval(gameInterval);remaining=10;$('#countdown').textContent='10 s';$('#startTimer').disabled=false;gameInterval=setInterval(()=>{remaining--;$('#countdown').textContent=remaining>0?remaining+' s':'Time’s up! / Время!';if(remaining<=0)clearInterval(gameInterval);},1000);}
$('#boxes').onclick=e=>{const b=e.target.closest('[data-box]');if(!b)return;const n=+b.dataset.box;if(used.has(n))return;gameActive=n;gameScored=false;used.add(n);renderGame();$('#gameTitle').textContent=`BOX ${n+1} · TEAM ${team?'B':'A'}`;$('#gameQuestion').innerHTML=gameData[n][0];$('#gameAnswer').textContent=gameData[n][1];$('#gameAnswer').hidden=true;$('#revealGame').disabled=false;$('#gameCorrect').disabled=false;$('#gameIncorrect').disabled=false;$('#gameHint').textContent='Оцените ответ один раз. Возврат без оценки даёт 0 баллов.';openModal('gameModal');startTimer();};
$('#startTimer').onclick=startTimer;$('#revealGame').onclick=()=>{$('#gameAnswer').hidden=false;$('#revealGame').disabled=true;clearInterval(gameInterval);};
function scoreGame(correct){if(gameScored||gameActive<0)return;gameScored=true;clearInterval(gameInterval);if(correct)scores[team]++;$('#gameAnswer').hidden=false;$('#revealGame').disabled=true;$('#gameCorrect').disabled=true;$('#gameIncorrect').disabled=true;$('#startTimer').disabled=true;$('#gameHint').textContent=`TEAM ${team?'B':'A'}: ${correct?'+1 point ✓':'0 points'} · Нажмите Return to Boxes.`;if($('#alternate').checked)team=1-team;renderGame();}
$('#gameCorrect').onclick=()=>scoreGame(true);$('#gameIncorrect').onclick=()=>scoreGame(false);function returnBoxes(){clearInterval(gameInterval);gameActive=-1;closeModal('gameModal');$('#boxes').querySelector('button:not(:disabled)')?.focus();}$('#returnBoxes').onclick=returnBoxes;
$$('[data-team]').forEach(b=>b.onclick=()=>{team=+b.dataset.team;renderGame();});
let confirmAction;function confirmReset(text,fn){$('#confirmText').textContent=text;confirmAction=fn;openModal('confirmModal');}$('#confirmYes').onclick=()=>{confirmAction?.();closeModal('confirmModal');toast('Готово — ответы сброшены.');};
function resetGame(){clearInterval(gameInterval);scores=[0,0];team=0;used.clear();gameActive=-1;renderGame();}
$('#resetGame').onclick=()=>confirmReset('Будут удалены баллы обеих команд и открытые коробки.',resetGame);
$('#reset').onclick=()=>confirmReset('Будут сброшены ответы, звуковая практика и командная игра. Аудиофайл останется загруженным.',()=>{$$('.reveal').forEach(b=>setReveal(b,false));$$('[data-choice]').forEach(b=>b.classList.remove('yes','no'));$$('.quiz .feedback').forEach(f=>f.textContent='');soundIndex=0;renderSound();resetGame();$('#weekend').innerHTML=`I usually ______ at weekends.${ru('Обычно по выходным я ______. Нажмите на занятие.')}`;});
renderGame();let restored=0;try{restored=Number(sessionStorage.getItem('ee-slide'))||0;}catch{}go(restored);
